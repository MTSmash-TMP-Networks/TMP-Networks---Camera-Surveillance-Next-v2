server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 520m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' blob:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  location = /api/system/update/upload {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /api/cameras/discover {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location /ws/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # go2rtc may return absolute session/segment paths from manifests or WHEP Location
  # headers. Keep these compatibility routes before the backend /api/ proxy so browser
  # follow-up requests stay wired even when go2rtc is hosted below /media/go2rtc.
  location /api/hls/ {
    auth_request /internal/go2rtc-auth;
    proxy_pass http://mediamtx:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires off;
  }

  location /api/webrtc/ {
    auth_request /internal/go2rtc-auth;
    proxy_pass http://mediamtx:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires off;
  }


  location /live-hls/ {
    alias /data/live/;
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Accel-Buffering "no" always;
    expires -1;
    sendfile on;
    tcp_nopush on;
  }

  location /api/ {
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires off;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
  }

  location = /internal/go2rtc-auth {
    internal;
    proxy_pass http://backend:3000/internal/go2rtc-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/go2rtc/ {
    auth_request /internal/go2rtc-auth;
    proxy_pass http://mediamtx:1984;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires off;
  }

  # Legacy aliases are intentionally kept as 410 responses so stale clients fail fast.
  location /media/webrtc/ { return 410; }
  location /media/hls/ { return 410; }

  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
}
