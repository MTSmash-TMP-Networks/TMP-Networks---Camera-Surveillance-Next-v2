<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self';">
<title>TMP Camera Desktop</title><style>
:root{color-scheme:dark;font-family:system-ui, sans-serif}body{background:radial-gradient(circle at 30% 10%,#183251,#08121f 65%);min-height:100vh;margin:0;display:grid;place-items:center;color:#eaf3ff}.panel{max-width:540px;padding:40px;background:#101e2fdc;border:1px solid #39516b;border-radius:22px;box-shadow:0 25px 80px #0008}h1{font-size:28px;margin:0 0 8px}p{color:#a9bfd6;line-height:1.55}label{display:block;margin:24px 0 8px;font-weight:600}input{display:block;box-sizing:border-box;width:100%;padding:14px;background:#091626;color:#fff;border:1px solid #54718c;border-radius:10px;font:inherit}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#40c2f0;color:#061322;font-weight:750;font-size:16px;cursor:pointer}small{display:block;color:#819eb9;margin-top:16px}#error{color:#ffb5ae;min-height:1.5em}
</style></head><body><main class="panel"><h1>TMP Camera Desktop</h1><p>Verbinde dich mit deinem bestehenden TMP Camera Surveillance Server. Der Client installiert keinen zweiten Server.</p><form id="connect"><label for="server">Serveradresse</label><input id="server" type="url" required placeholder="http://192.168.1.100:8080" autocomplete="url"><button>Verbinden</button><p id="error" role="alert"></p></form><small>Nutze HTTPS bei Zugriff über das Internet. Selbstsignierte Zertifikate müssen auf dem Client als vertrauenswürdig installiert sein.</small></main><script src="setup.js"></script></body></html>
