name: Cross-version update compatibility
on:
  pull_request:
  push:
    branches: [main]
jobs:
  legacy-upgrade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate legacy root paths and source manifest
        run: node scripts/check-update-compatibility.mjs
      - name: Validate host recovery script syntax
        run: sh -n scripts/recover-updater-compose-v2.sh
      - name: Validate the Compose V2 plugin inside the updater image
        run: |
          docker build --tag tmp-camera-updater-compose-v2-ci updater
          docker run --rm --entrypoint docker tmp-camera-updater-compose-v2-ci compose version
      - name: Validate go2rtc root API fallback
        run: node --test backend/test-node/go2rtc-control-api.test.mjs
      - name: Validate Voscam ONVIF TCP 888 discovery and setup
        run: node --test backend/test-node/voscam-onvif-port-888.test.mjs
      - name: Validate cloud media relay chunk encoding and concurrency contracts
        run: node --test backend/test-node/remote-proxy-transfer.test.mjs
      - name: Validate cloud recording archive authorization and bounded HLS
        run: |
          node --test backend/test-node/remote-proxy-policy.test.mjs
          node --test backend/test-node/cloud-recording-clip.test.mjs
      - name: Validate bounded MP4 cloud downloads and proxy read-only allowlist
        run: node --test backend/test-node/cloud-recording-download.test.mjs
      - name: Validate cached cloud archive HLS windows and proxy authorization
        run: node --test backend/test-node/cloud-archive-hls-cache.test.mjs
      - name: Validate opt-in cloud live audio authentication and route policy
        run: node --test backend/test-node/cloud-live-audio.test.mjs
      - name: Verify local and cloud live audio session, AAC HLS and speaker control
        run: node --test backend/test-node/live-audio-session.test.mjs
      - name: Install backend dependencies for full discovery probe test
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Validate Reolink vendor-port evidence and non-camera false positives
        run: |
          node --test backend/test-node/camera-discovery-precision-regression.test.mjs
          node --test backend/test-node/camera-discovery-final-policy-regression.test.mjs
      - name: Validate fair 26-camera cold-start and deferred recovery
        run: node --test backend/test-node/camera-bootstrap-fairness-26.test.mjs
      - name: Validate adaptive camera startup capacity
        run: node --test backend/test-node/adaptive-camera-start.test.mjs
      - name: Validate camera discovery deadlines and progressive results
        run: node --test backend/test-node/discovery-completion-timeout.test.mjs
      - name: Validate updater compatibility regressions
        run: node --test backend/test-node/update-compatibility.test.mjs
      - name: Validate persistent camera thumbnail cache and source isolation
        run: node --test backend/test-node/camera-thumbnail-cache.test.mjs
      - name: Validate snapshot fallback native stream re-probing
        run: node --test backend/test-node/snapshot-native-recovery.test.mjs
      - name: Validate delayed browser HLS recovery and kiosk buffering
        run: |
          node --test backend/test-node/hls-recovery-stability.test.mjs
          node scripts/hls-recovery-smoke-test.mjs
      - name: Validate HLS buffering and stream status regressions
        run: |
          node --test backend/test-node/local-hls-command.test.mjs
          node --test backend/test-node/stream-stability-regression.test.mjs
          node --test backend/test-node/recording-recovery-policy.test.mjs
          node --test backend/test-node/local-hls-health.test.mjs
      - name: Validate kiosk and recording VM memory safeguards
        run: node --test backend/test-node/kiosk-broker-oom-guard.test.mjs
      - name: Validate motion/recording CPU cost and local HLS segment fallbacks
        run: |
          node --test backend/test-node/motion-local-segment.test.mjs
          node --test backend/test-node/motion-recording-cpu-regression.test.mjs
      - name: Validate recording watchdog and kiosk heartbeat resilience
        run: node --test backend/test-node/recording-kiosk-crashguard.test.mjs
      - name: Validate PTZ responsiveness and physical stop safety
        run: |
          node --test backend/test-node/ptz-responsive-regression.test.mjs
          node --test backend/test-node/ptz-command-runtime.test.mjs
          node --test backend/test-node/ptz-automation-interlock.test.mjs
      - name: Validate desktop client distribution and Electron installer
        run: node --test frontend/test-node/desktop-client-distribution.test.mjs
      - name: Catch unclosed cloud WebApp JSX condition before production build
        run: node --test frontend/test-node/cloud-webapp-link.test.mjs
      - name: Install package dependencies and run actual unit tests and frontend build
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run test --prefix backend
          npm run test:critical --prefix backend
          npm run test:ci --prefix frontend
          npm run build --prefix frontend
          npm run test --prefix updater
