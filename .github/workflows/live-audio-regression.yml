name: Live audio and recording A/V regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Verify live AAC, recording A/V reuse and real MPEG-TS ffprobe
        run: |
          node --test backend/test-node/live-audio-session.test.mjs
          node --test backend/test-node/broker-pipeline.test.mjs
          node --test backend/test-node/go2rtc-control-api.test.mjs
          node --test backend/test-node/cloud-live-audio.test.mjs
      - name: Check export module, ticket and route syntax
        run: |
          node --check backend/src/services/recording/RecordingEvidenceExport.js
          node --check backend/src/services/recording/EvidenceDownloadTickets.js
          node --check backend/src/services/recording/ZipStoreWriter.js
          node --check backend/src/routes/recordings.js
      - name: Verify native streaming evidence ZIP and large-day download contract
        run: node --test backend/test-node/evidence-streaming-zip.test.mjs
      - name: Install FFmpeg for real multi-segment M3U8 decoding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg unzip
          ffmpeg -version
          ffprobe -version
      - name: Verify multi-segment evidence.m3u8 playback with reset MPEG-TS timestamps
        env:
          REQUIRE_FFMPEG: '1'
        run: node --test backend/test-node/evidence-hls-segment-continuity.test.mjs
      - name: Verify indexed MP4 across independent recording blocks and ZIP contents
        env:
          REQUIRE_FFMPEG: '1'
        run: node --test backend/test-node/evidence-mp4-export.test.mjs
      - name: Verify day-wide archive HLS and wall-clock seeking across sessions
        env:
          REQUIRE_FFMPEG: '1'
        run: node --test backend/test-node/archive-global-timeline.test.mjs
      - name: Verify recording command stays stable
        run: npm test --prefix backend -- test/recording-command.test.js
      - name: Verify one visible Live player when toggling audio
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          cd frontend
          ./node_modules/.bin/vitest run test/live-player-single-window.test.js
